<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IDB;src:url(fonts/InterDisplay-Black.otf)}
@font-face{font-family:IDBI;src:url(fonts/InterDisplay-BlackItalic.otf)}
@font-face{font-family:PopB;src:url(fonts/Poppins-Bold.ttf)}
@font-face{font-family:PopM;src:url(fonts/Poppins-Medium.ttf)}
*{box-sizing:border-box}
html,body{margin:0;background:#F9EEE4;width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:540px 960px}
.abs{position:absolute}
.stk{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap}
.row{position:absolute;left:50px;width:980px;height:100px;border-radius:26px;background:#fff;display:flex;align-items:center;gap:22px;padding:0 28px 0 16px;box-shadow:0 6px 18px rgba(80,40,20,.08)}
.th{width:72px;height:72px;border-radius:18px;background:#F4E3D5;display:flex;align-items:center;justify-content:center;font-size:42px;flex:none}
.nm{flex:1;font-weight:600;font-size:36px;color:#141414;white-space:nowrap;overflow:hidden}
.nm small{display:block;font-weight:500;font-size:24px;color:#8a7d72;margin-top:2px}
.pr{font-weight:800;font-size:38px;color:#141414}
.mk{display:inline-block;background:#FF592A;color:#000;font-family:IDBI;padding:18px 34px 22px;line-height:1}
</style></head>
<body><div id="stage"></div>
<div style="position:absolute;opacity:0"><span style="font-family:IDB">ą</span><span style="font-family:IDBI">ą</span><span style="font-family:PopB">ą</span><span style="font-family:PopM">ą</span><span style="font-family:Inter;font-weight:800">ą</span>🎙️📷🎚️💡🎧🦾🧽🔌🛁🛒✅😳👆</div>

<script src="anim.js"></script>
</body></html>
