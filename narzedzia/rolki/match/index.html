<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IDB;src:url(fonts/InterDisplay-Black.otf)}
@font-face{font-family:IDBI;src:url(fonts/InterDisplay-BlackItalic.otf)}
@font-face{font-family:PopB;src:url(fonts/Poppins-Bold.ttf)}
@font-face{font-family:PopM;src:url(fonts/Poppins-Medium.ttf)}
*{box-sizing:border-box}
html,body{margin:0;background:#1A0E18;width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:540px 960px}
.abs{position:absolute}
.stk{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap}
.card{position:absolute;left:70px;top:360px;width:940px;height:1180px;border-radius:56px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);transform-origin:50% 120%}
.tag{display:inline-block;padding:14px 26px;border-radius:40px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);color:#fff;font:600 34px Inter;margin:0 12px 14px 0}
.stamp{position:absolute;top:120px;padding:10px 30px;border:10px solid;border-radius:22px;font-family:IDB;font-size:110px;letter-spacing:4px}
.btn{position:absolute;top:1600px;width:170px;height:170px;border-radius:85px;display:flex;align-items:center;justify-content:center;font:900 90px Inter;box-shadow:0 14px 40px rgba(0,0,0,.4)}
</style></head>
<body><div id="stage"></div>
<div style="position:absolute;opacity:0"><span style="font-family:IDB">ą</span><span style="font-family:IDBI">ą</span><span style="font-family:PopB">ą</span><span style="font-family:PopM">ą</span><span style="font-family:Inter;font-weight:800">ą</span>🍳🚗🧥💼🎙️❤️✕👋✅📍🔥</div>

<script src="anim.js"></script>
</body></html>
